<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aveline — Dashboard</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0a0a0a;color:#e8ff6b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    body{display:grid;place-items:center}
    .loading{font-size:13px;letter-spacing:1px;opacity:.7}
  </style>
</head>
<body>
  <div class="loading">Waking Aveline…</div>
  <script>
    (async () => {
      const OLD_API = 'https://aveline-bot-production.up.railway.app';
      const NEW_API = 'https://aveline-bot-production-d5d6.up.railway.app';

      try {
        const response = await fetch('/dashboard.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Dashboard asset returned ${response.status}`);

        const source = (await response.text())
          .replaceAll(OLD_API, NEW_API)
          .replace(
            '</body>',
            '<script src="/debug-addon.js?v=20260821-10"><\/script>' +
            '<script src="/debug-health-addon.js?v=20260821-10"><\/script>' +
            '<script src="/debug-state-addon.js?v=20260821-10"><\/script>' +
            '<script src="/feed-live-addon.js?v=20260821-10"><\/script>' +
            '<script src="/router-health-addon.js?v=20260821-10"><\/script>' +
            '<script src="/relationship-addon.js?v=20260821-10"><\/script>' +
            '<script src="/interaction-debug-addon.js?v=20260821-10"><\/script></body>'
          );

        document.open();
        document.write(source);
        document.close();
      } catch (error) {
        document.body.innerHTML = `<div style="max-width:520px;padding:24px;text-align:center;color:#ff5f5f">Dashboard failed to load.<br><small style="color:#888">${String(error.message || error)}</small></div>`;
      }
    })();
  </script>
</body>
</html>
